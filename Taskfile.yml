# Local development orchestration for the hisgarden/open-design fork.
#
# Run `task --list` to discover. Run `task <name>` to invoke. Long-running
# tasks (web, beam) are foreground; up/down compositions backgrounding +
# health-checking the pieces.
#
# Why this exists: the fork adds a BEAM bridge + DeepInfra image surface
# that needs ~6 env vars to launch correctly. Pasting them as a multi-line
# command into a terminal regularly breaks on line-wrap. A Taskfile makes
# the env stack a definition that can't be copy-paste-corrupted.

version: '3'

vars:
  REPO_ROOT:
    sh: pwd
  BEAM_REPO: '{{.HOME}}/code/beam-design-daemon'
  BEAM_RUN_DIR: '{{.REPO_ROOT}}/apps/beam-daemon'
  WEB_PORT: '17573'
  DAEMON_PORT: '17456'
  BEAM_PORT: '4000'

env:
  # BEAM bridge env stack — sourced by web:up:bridge and stack:up tasks.
  # NOT exported globally so web:up (no bridge) stays clean.
  BEAM_DAEMON_URL: ws://127.0.0.1:4000/socket/websocket
  BEAM_AGENT_ID: deepinfra
  # V4-Pro is slower but reliably round-trips long tool_call content
  # arguments (the deck-generation path needs ~5-10KB content args).
  # V4-Flash is faster but truncates content to "" on big calls — see
  # docs/plans/2026-05-04-003 model-selection notes. Override per-run
  # via the request body's `model` field once the bridge stops dropping
  # it (see pickModel in apps/web/sidecar/beam-bridge.ts).
  BEAM_MODEL_TEXT: deepseek-ai/DeepSeek-V4-Pro
  BEAM_MODEL_VISION: Qwen/Qwen3-VL-235B-A22B-Instruct

tasks:
  default:
    desc: Show this help.
    cmds:
      - task --list

  # ---- web sidecar (Node) ------------------------------------------------

  web:up:
    desc: 'Start the web sidecar with NO BEAM bridge (Image tab works; chat uses upstream JS daemon CLI agents).'
    aliases: [up:plain, plain]
    cmds:
      - |
        unset BEAM_DAEMON_URL BEAM_AGENT_ID BEAM_MODEL_TEXT BEAM_MODEL_VISION
        pnpm tools-dev run web --daemon-port {{.DAEMON_PORT}} --web-port {{.WEB_PORT}}

  web:up:bridge:
    desc: 'Start the web sidecar with the BEAM bridge active (chat → BEAM → DeepInfra; needs beam:up running first).'
    aliases: [up:bridge, bridge]
    cmds:
      - pnpm tools-dev run web --daemon-port {{.DAEMON_PORT}} --web-port {{.WEB_PORT}}

  web:down:
    desc: 'Stop the web sidecar + JS daemon (tools-dev IPC stop, plus port-based fallback).'
    cmds:
      # Authoritative: tools-dev stop kills the registered daemon+web pair
      # regardless of which ports they auto-allocated.
      - pnpm tools-dev stop 2>&1 | tail -5 || true
      # Belt-and-suspenders: kill anything still bound to the configured ports
      # (e.g., a foreground `task web:up:bridge` that didn't register cleanly).
      - pkill -f 'tools-dev run web' 2>/dev/null || true
      - |
        for p in {{.WEB_PORT}} {{.DAEMON_PORT}}; do
          pid=$(lsof -nP -iTCP:$p -sTCP:LISTEN 2>/dev/null | awk 'NR==2{print $2}')
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
        done
      - echo "web sidecar stopped"

  # ---- BEAM daemon (Elixir/Phoenix) --------------------------------------
  #
  # Runs from {{.BEAM_RUN_DIR}} (apps/beam-daemon/, the in-repo subtree).
  # First run fetches deps via `mix deps.get`. The standalone {{.BEAM_REPO}}
  # is used only by beam:sync:* for cross-repo subtree push/pull.

  beam:up:
    desc: 'Start the BEAM Design Daemon (Phoenix endpoint on :{{.BEAM_PORT}}). Foreground; Ctrl-C stops.'
    cmds:
      - |
        cd {{.BEAM_RUN_DIR}}
        mix deps.get
        BEAM_DESIGN_WORKSPACE_DIR={{.REPO_ROOT}} mix run --no-halt

  beam:down:
    desc: 'Stop the BEAM Design Daemon (kills any process listening on :{{.BEAM_PORT}}).'
    cmds:
      - |
        pid=$(lsof -nP -iTCP:{{.BEAM_PORT}} -sTCP:LISTEN 2>/dev/null | awk 'NR==2{print $2}')
        if [ -n "$pid" ]; then
          kill "$pid" 2>/dev/null
          sleep 2
          echo "BEAM stopped (was PID $pid)"
        else
          echo "BEAM not running"
        fi

  # ---- combined stack ----------------------------------------------------

  stack:status:
    desc: 'Show which Open Design + BEAM processes are listening locally.'
    aliases: [status]
    silent: true
    cmds:
      - |
        echo "=== ports ==="
        lsof -nP -iTCP:{{.WEB_PORT}},{{.DAEMON_PORT}},{{.BEAM_PORT}} -sTCP:LISTEN 2>/dev/null \
          | awk 'NR==1 || /LISTEN/ {printf "%-12s %-8s %s\n", $1, $2, $9}'
        echo
        echo "=== health ==="
        for label_port in 'web:{{.WEB_PORT}}' 'daemon:{{.DAEMON_PORT}}/api/health' 'BEAM:{{.BEAM_PORT}}'; do
          label="${label_port%%:*}"
          rest="${label_port#*:}"
          port="${rest%%/*}"
          path="/${rest#*/}"
          [ "$rest" = "$port" ] && path="/"
          code=$(curl -sS -m 2 -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}${path}" 2>/dev/null || true)
          if [ -z "$code" ] || [ "$code" = "000" ]; then code="DOWN"; fi
          printf "%-8s %-25s → %s\n" "$label" "http://127.0.0.1:${port}${path}" "$code"
        done

  beam:up:bg:
    desc: 'Start BEAM in background (logs at .tmp/stack/beam.log). Idempotent — no-op if :{{.BEAM_PORT}} already listening. Resolves the DeepInfra key from $DEEPINFRA_API_KEY → $OPENAI_API_KEY → Keychain entry "OPENAI_API_KEY".'
    cmds:
      - |
        # Resolve the DeepInfra key. Local convention: same value as
        # OPENAI_API_KEY (DeepInfra serves an OpenAI-compatible route),
        # stored once in macOS Keychain under service "OPENAI_API_KEY".
        # Priority: explicit env override → OPENAI_API_KEY env → Keychain.
        resolved=""
        source=""
        if [ -n "${DEEPINFRA_API_KEY:-}" ]; then
          resolved="$DEEPINFRA_API_KEY"
          source="DEEPINFRA_API_KEY env"
        elif [ -n "${OPENAI_API_KEY:-}" ]; then
          resolved="$OPENAI_API_KEY"
          source="OPENAI_API_KEY env"
        else
          kc=$(security find-generic-password -s OPENAI_API_KEY -w 2>/dev/null || true)
          if [ -n "$kc" ]; then
            resolved="$kc"
            source="Keychain (OPENAI_API_KEY)"
          fi
        fi
        if [ -z "$resolved" ]; then
          echo "ERROR: could not resolve DeepInfra key." >&2
          echo "       Tried: \$DEEPINFRA_API_KEY env, \$OPENAI_API_KEY env, Keychain 'OPENAI_API_KEY'." >&2
          echo "       Add to Keychain: security add-generic-password -s OPENAI_API_KEY -a \$USER -w" >&2
          exit 1
        fi
        echo "[stack] DeepInfra key source: $source"

        pid=$(lsof -nP -iTCP:{{.BEAM_PORT}} -sTCP:LISTEN 2>/dev/null | awk 'NR==2{print $2}')
        if [ -n "$pid" ]; then
          echo "beam already running (pid $pid)"
          exit 0
        fi
        mkdir -p {{.REPO_ROOT}}/.tmp/stack
        cd {{.BEAM_RUN_DIR}}
        mix deps.get >/dev/null
        BEAM_DESIGN_WORKSPACE_DIR={{.REPO_ROOT}} \
        DEEPINFRA_API_KEY="$resolved" \
          nohup mix run --no-halt > {{.REPO_ROOT}}/.tmp/stack/beam.log 2>&1 &
        echo $! > {{.REPO_ROOT}}/.tmp/stack/beam.pid
        disown $! 2>/dev/null || true
        echo "beam starting (pid $(cat {{.REPO_ROOT}}/.tmp/stack/beam.pid)), logs: .tmp/stack/beam.log"

  web:up:bridge:bg:
    desc: 'Start web+daemon with BEAM bridge in background (logs at .tmp/stack/web.log). Idempotent. Used by stack:up.'
    cmds:
      - |
        if lsof -nP -iTCP:{{.WEB_PORT}} -sTCP:LISTEN >/dev/null 2>&1 \
           && lsof -nP -iTCP:{{.DAEMON_PORT}} -sTCP:LISTEN >/dev/null 2>&1; then
          echo "web+daemon already listening on :{{.WEB_PORT}} and :{{.DAEMON_PORT}}"
          exit 0
        fi
        mkdir -p {{.REPO_ROOT}}/.tmp/stack
        # tools-dev `run web` is foreground, so we nohup-background it ourselves
        # to keep the env stack (BEAM_DAEMON_URL, BEAM_AGENT_ID, etc.) attached.
        nohup pnpm tools-dev run web \
          --daemon-port {{.DAEMON_PORT}} \
          --web-port {{.WEB_PORT}} \
          > {{.REPO_ROOT}}/.tmp/stack/web.log 2>&1 &
        echo $! > {{.REPO_ROOT}}/.tmp/stack/web.pid
        disown $! 2>/dev/null || true
        echo "web sidecar starting (pid $(cat {{.REPO_ROOT}}/.tmp/stack/web.pid)), logs: .tmp/stack/web.log"

  stack:up:
    desc: 'Bring up the full stack (BEAM + JS daemon + web bridge) in background with health gating. Resolves the DeepInfra key from $DEEPINFRA_API_KEY → $OPENAI_API_KEY env → macOS Keychain entry "OPENAI_API_KEY". Use `task stack:status` to recheck or `task stack:down` to stop.'
    aliases: [up]
    cmds:
      - task: beam:up:bg
      - task: web:up:bridge:bg
      - |
        # Health gate — poll each endpoint up to 45s for a non-DOWN response.
        ok=1
        for label_port_path in 'BEAM:{{.BEAM_PORT}}/' 'daemon:{{.DAEMON_PORT}}/api/health' 'web:{{.WEB_PORT}}/' ; do
          label="${label_port_path%%:*}"
          rest="${label_port_path#*:}"
          port="${rest%%/*}"
          path="/${rest#*/}"
          [ "$rest" = "$port" ] && path="/"
          deadline=$(( $(date +%s) + 45 ))
          code=""
          while : ; do
            code=$(curl -sS -m 1 -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}${path}" 2>/dev/null || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              code="DOWN"
              ok=0
              break
            fi
            sleep 0.5
          done
          printf "  %-8s :%-6s%-22s → %s\n" "$label" "$port" "$path" "$code"
        done
        if [ $ok -eq 1 ]; then
          echo "stack:up OK"
        else
          echo "stack:up FAILED — see .tmp/stack/{beam,web}.log for details" >&2
          exit 1
        fi

  stack:down:
    desc: 'Stop everything (web sidecar + JS daemon + BEAM).'
    aliases: [down]
    cmds:
      - task: web:down
      - task: beam:down
      - |
        rm -f {{.REPO_ROOT}}/.tmp/stack/beam.pid {{.REPO_ROOT}}/.tmp/stack/web.pid 2>/dev/null || true

  # ---- smoke tests -------------------------------------------------------

  smoke:image:
    desc: 'Drive a single Qwen-Image-Max t2i call through /api/media/generate. Needs web:up running. Runs on bun (no tsx, native TS).'
    cmds:
      - |
        bun run scripts/qwen-image-edit-smoke.ts \
          --model qwen-image-max --aspect 16:9 \
          --name "taskfile smoke" \
          --prompt "xkcd-style hand-drawn black-and-white. ALL TEXT HAND-LETTERED ALL-CAPS. A simple stick figure waves. Caption: 'TASKFILE SMOKE OK'."

  smoke:bridge:
    desc: 'Drive a single chat run through the BEAM bridge. Needs both beam:up and web:up:bridge running.'
    cmds:
      - |
        RUN=$(curl -sS -X POST http://127.0.0.1:{{.WEB_PORT}}/api/runs \
          -H 'content-type: application/json' \
          -d '{"agentId":"claude","message":"reply with one sentence: bridge smoke ok","skillId":"html-ppt","designSystemId":"obsidian-claude-gradient"}')
        RID=$(python3 -c "import json,sys; print(json.loads('$RUN')['runId'])")
        echo "runId=$RID"
        curl -sS -N -m 30 "http://127.0.0.1:{{.WEB_PORT}}/api/runs/$RID/events" 2>&1 | head -20

  smoke:deck:
    desc: 'Drive an end-to-end deck-generation run through the BEAM tool loop. Asserts at least one file was written under <project_dir>. Needs beam:up + web:up:bridge + DEEPINFRA_API_KEY in BEAM env. Runs on bun.'
    cmds:
      - bun run scripts/beam-deck-smoke.ts

  smoke:bridge:thread:
    desc: 'Drive a 2-turn run on the same conversationId. Asserts the second turn sees the first turn''s history (Phase 4C resumption). Needs beam:up + web:up:bridge. Runs on bun.'
    cmds:
      - bun run scripts/beam-thread-smoke.ts

  # ---- gates -------------------------------------------------------------

  check:
    desc: 'Run the full pre-commit gate suite (typecheck + tests + guard).'
    cmds:
      - pnpm -r --if-present run typecheck
      - pnpm -r --if-present run test
      - pnpm guard

  check:typecheck:
    desc: 'Just the typechecks (web + daemon + everything else with a typecheck script).'
    cmds:
      - pnpm -r --if-present run typecheck

  check:test:
    desc: 'Just the tests.'
    cmds:
      - pnpm -r --if-present run test

  check:guard:
    desc: 'Run upstream''s `pnpm guard` (residual-js + media-models drift + other gates).'
    cmds:
      - pnpm guard

  # ---- BEAM subtree sync (hybrid repo arrangement) -----------------------

  beam:sync:pull:
    desc: 'Pull BEAM-only commits FROM the standalone repo INTO apps/beam-daemon/ (subtree pull).'
    cmds:
      - git subtree pull --prefix=apps/beam-daemon {{.BEAM_REPO}} feat/v1-skeleton

  beam:sync:push:
    desc: 'Push BEAM-only commits FROM apps/beam-daemon/ BACK to the standalone repo (subtree push).'
    cmds:
      - git subtree push --prefix=apps/beam-daemon {{.BEAM_REPO}} feat/v1-skeleton

# ##############################################################################
# Changelog:
# 2026-05-04  Initial Taskfile — web:up{,:bridge}, beam:up/down, stack:status,
#             smoke:{image,bridge}, check (full + per-gate), beam:sync:{pull,push}.
# 2026-05-06  Add stack:up + beam:up:bg + web:up:bridge:bg — backgrounded,
#             idempotent, env-validated startup with 45s health gating;
#             logs at .tmp/stack/{beam,web}.log.
# 2026-05-06  beam:up:bg now resolves the DeepInfra key from
#             $DEEPINFRA_API_KEY → $OPENAI_API_KEY env → macOS Keychain
#             entry "OPENAI_API_KEY" (DeepInfra reuses the OpenAI key in
#             this env). Removes the env-only requirement.
# ##############################################################################
